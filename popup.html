<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="pop-header">
    <img class="pop-mascot" src="assets/fox.png" alt="" />
    <div>
      <div class="pop-title">speedfox</div>
      <div class="pop-subtitle">time you got back</div>
    </div>
  </div>

  <div class="pop-hero">
    <div class="pop-hero-value" id="totalHours">0</div>
    <div class="pop-hero-label">hours saved, all time</div>
  </div>

  <div class="pop-grid">
    <div class="pop-card">
      <div class="pop-card-value" id="weekHours">0h</div>
      <div class="pop-card-label">this week</div>
    </div>
    <div class="pop-card">
      <div class="pop-card-value" id="videoCount">0</div>
      <div class="pop-card-label">videos</div>
    </div>
  </div>

  <div class="pop-video" id="videoPanel" hidden>
    <div class="pop-video-head">
      <span class="pop-section-label">this video</span>
      <span class="pop-video-speed" id="videoSpeed">1×</span>
    </div>
    <div class="pop-row">
      <span class="pop-row-label">Finishes at</span>
      <span class="pop-row-value" id="videoFinish">—</span>
    </div>
    <div class="pop-row">
      <span class="pop-row-label">Time left</span>
      <span class="pop-row-value"><span id="videoLeft">—</span> <span class="pop-was" id="videoWas"></span></span>
    </div>
    <div class="pop-row">
      <span class="pop-row-label">Saving</span>
      <span class="pop-row-value pop-saving" id="videoSaving">—</span>
    </div>
    <div class="pop-estimate" id="videoEstimate"></div>
    <div class="pop-suggestion" id="videoSuggestion" hidden>
      <span id="videoSuggestionText"></span>
      <button id="videoSuggestionApply">Apply</button>
    </div>
  </div>
  <div class="pop-video-empty" id="videoEmpty" hidden>No video in this tab</div>

  <label class="pop-toggle">
    <input type="checkbox" id="otherSitesToggle" />
    <span>Also run on other video sites</span>
  </label>

  <div class="pop-actions">
    <button id="exportBtn" class="pop-btn">Export</button>
    <button id="resetBtn" class="pop-btn">Reset</button>
  </div>

  <script src="lib/widget-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
